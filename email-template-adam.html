<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- EDIT: EMAIL TITLE -->
  <title>Título do email</title>
  <style>
    @media only screen and (max-width: 620px) {
      .adam-email-shell { width: 100% !important; }
      .adam-email-header { padding: 28px 22px !important; }
      .adam-email-body { padding: 30px 22px !important; }
      .adam-email-footer { padding: 24px 22px !important; }
      .adam-email-title { font-size: 26px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:40px 0;background:#f3f5f7;font-family:Arial,Helvetica,sans-serif;color:#1d2327;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:0 12px;">
        <table role="presentation" class="adam-email-shell" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.08);border-collapse:separate;">
          <tr>
            <td class="adam-email-header" style="background:#2e7d32;padding:35px;text-align:center;">
              <img src="https://airsoftmondego.pt/wp-content/uploads/2026/06/ADAM.png" alt="ADAM" width="180" style="width:180px;max-width:100%;height:auto;display:block;margin:0 auto 25px;border:0;">
              <!-- EDIT: EMAIL TITLE -->
              <h1 class="adam-email-title" style="margin:0;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:30px;line-height:1.25;font-weight:700;">Título do email</h1>
            </td>
          </tr>
          <tr>
            <td class="adam-email-body" style="padding:40px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.8;color:#1d2327;">
              <!-- EDIT: RECIPIENT NAME -->
              <p style="margin:0 0 24px;">Olá [NOME],</p>

              <!-- EDIT: MAIN MESSAGE -->
              <p style="margin:0;">[MENSAGEM]</p>

              <!-- OPTIONAL BUTTON: remove this entire commented block if not needed.
              <p style="margin:28px 0 0;">
                <a href="https://example.com" style="display:inline-block;background:#2e7d32;color:#ffffff;padding:12px 20px;text-decoration:none;border-radius:4px;font-weight:700;">TEXTO DO BOTÃO</a>
              </p>
              -->
            </td>
          </tr>
          <tr>
            <td class="adam-email-footer" style="padding:30px;background:#fafafa;border-top:1px solid #e4e4e4;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.8;color:#666666;">
              <p style="margin:0 0 18px;">Caso necessite de ajuda ou esclarecimentos, contacte-nos através de <a href="mailto:apoio@airsoftmondego.pt" style="color:#2e7d32;">apoio@airsoftmondego.pt</a>.</p>
              <p style="margin:0;"><strong>ADAM - Associação Desportiva de Airsoft do Mondego</strong></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
